// ── State ───────────────────────────────────────────────────────
let currentUser = null;

// ── Init ────────────────────────────────────────────────────────
initDarkMode();
setActiveNav();
requireAuth(user => {
  currentUser = user;
  document.getElementById("userChip").textContent = user.displayName || user.email;
  addSubject(); // default empty row
});

document.getElementById("darkToggleBtn").onclick = toggleDark;
document.getElementById("logoutBtn").onclick = logout;

// ── Auto-fill on branch + semester change ───────────────────────
window.onBranchOrSemChange = function () {
  const branch = document.getElementById("branchSelect").value;
  const sem    = document.getElementById("semSelect").value;
  const info   = document.getElementById("autoFillInfo");

  if (!branch || !sem) { info.textContent = ""; return; }

  const subjects = CURRICULUM[branch]?.[sem];
  if (!subjects) {
    info.textContent = "No preset data for this combination. Add subjects manually.";
    return;
  }

  document.getElementById("subjectRows").innerHTML = "";
  subjects.forEach(s => addSubject(s.name, s.credits));
  info.textContent = `✅ Auto-filled ${subjects.length} subjects for ${branch} – ${sem}`;
};

// ── Subject row management ──────────────────────────────────────
window.addSubject = function (name = "", credits = "") {
  const container = document.getElementById("subjectRows");
  const row = document.createElement("div");
  row.className = "subject-row";
  row.innerHTML = `
    <input class="sub-name" type="text" placeholder="Subject name" value="${name}" />
    <select class="grade-sel">
      ${Object.keys(GRADE_POINTS).map(g =>
        `<option value="${g}">${g}</option>`
      ).join("")}
    </select>
    <input type="number" class="credit-inp" placeholder="Credits" min="1" max="6" value="${credits}" />
    <button class="remove-btn" onclick="this.closest('.subject-row').remove()">✕</button>
  `;
  container.appendChild(row);
};

// ── Calculate SGPA ──────────────────────────────────────────────
window.calcSGPA = function () {
  const rows = document.querySelectorAll(".subject-row");
  const errEl = document.getElementById("sgpaError");
  errEl.textContent = "";
  document.getElementById("sgpaResult").style.display = "none";

  if (!rows.length) { errEl.textContent = "Add at least one subject."; return; }

  let weightedSum = 0, totalCredits = 0, valid = true;
  rows.forEach(row => {
    const name    = row.querySelector(".sub-name").value.trim();
    const grade   = row.querySelector(".grade-sel").value;
    const credits = parseFloat(row.querySelector(".credit-inp").value);
    if (!name || isNaN(credits) || credits <= 0) { valid = false; return; }
    weightedSum  += GRADE_POINTS[grade] * credits;
    totalCredits += credits;
  });

  if (!valid)        { errEl.textContent = "Fill in all subject names and valid credits."; return; }
  if (!totalCredits) { errEl.textContent = "Total credits must be greater than 0."; return; }

  const sgpa = (weightedSum / totalCredits).toFixed(2);
  const sem  = document.getElementById("semSelect").value || "Current Semester";

  document.getElementById("sgpaSemLabel").textContent = sem;
  document.getElementById("sgpaValue").textContent    = sgpa;
  document.getElementById("sgpaPercent").textContent  = `${toPercent(sgpa)}%`;
  document.getElementById("sgpaPerf").textContent     = gradePerformance(sgpa);
  document.getElementById("sgpaResult").style.display = "block";

  window._lastSGPA = { sgpa: parseFloat(sgpa), credits: totalCredits, sem, rows: [...rows] };
};

// ── Save to CGPA ────────────────────────────────────────────────
window.saveCloud = async function () {
  const msg = document.getElementById("saveMsg");
  if (!window._lastSGPA) { msg.textContent = "Calculate SGPA first."; return; }

  // build subjects array from current rows for dashboard compatibility
  const subjects = window._lastSGPA.rows.map(row => ({
    name:   row.querySelector(".sub-name").value.trim(),
    credit: parseFloat(row.querySelector(".credit-inp").value),
    grade:  row.querySelector(".grade-sel").value,
  }));

  try {
    await saveSemester(currentUser.uid, {
      sem:      window._lastSGPA.sem,
      sgpa:     window._lastSGPA.sgpa,
      credits:  window._lastSGPA.credits,
      subjects,
    });
    msg.textContent = "✅ Saved successfully!";
  } catch (e) {
    msg.textContent = "❌ Save failed: " + e.message;
  }
};

// ── Reset ───────────────────────────────────────────────────────
window.resetForm = function () {
  document.getElementById("branchSelect").value = "";
  document.getElementById("semSelect").value    = "";
  document.getElementById("autoFillInfo").textContent = "";
  document.getElementById("subjectRows").innerHTML    = "";
  document.getElementById("sgpaError").textContent    = "";
  document.getElementById("sgpaResult").style.display = "none";
  window._lastSGPA = null;
  addSubject();
};

// ── PDF download ────────────────────────────────────────────────
window.dlPDF = function () {
  if (!window._lastSGPA) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;
  doc.setFontSize(16);
  doc.text("SGPA Report", 14, y); y += 10;
  doc.setFontSize(12);
  doc.text(`Semester: ${window._lastSGPA.sem}`, 14, y); y += 8;
  doc.text(`SGPA: ${window._lastSGPA.sgpa}`, 14, y); y += 8;
  doc.text(`Total Credits: ${window._lastSGPA.credits}`, 14, y); y += 10;
  window._lastSGPA.rows.forEach(row => {
    const name    = row.querySelector(".sub-name").value;
    const grade   = row.querySelector(".grade-sel").value;
    const credits = row.querySelector(".credit-inp").value;
    doc.text(`${name} | Grade: ${grade} | Credits: ${credits}`, 14, y);
    y += 7;
    if (y > 270) { doc.addPage(); y = 20; }
  });
  doc.save(`SGPA_${window._lastSGPA.sem.replace(/\s/g,"_")}.pdf`);
};

// ── CSV export ──────────────────────────────────────────────────
window.exportCSV = function () {
  if (!window._lastSGPA) return;
  let csv = "Subject,Grade,Credits\n";
  window._lastSGPA.rows.forEach(row => {
    const name    = row.querySelector(".sub-name").value;
    const grade   = row.querySelector(".grade-sel").value;
    const credits = row.querySelector(".credit-inp").value;
    csv += `"${name}",${grade},${credits}\n`;
  });
  csv += `\nSGPA,${window._lastSGPA.sgpa}\nTotal Credits,${window._lastSGPA.credits}`;
  const a = document.createElement("a");
  a.href = "data:text/csv," + encodeURIComponent(csv);
  a.download = `SGPA_${window._lastSGPA.sem.replace(/\s/g,"_")}.csv`;
  a.click();
};
</script>
