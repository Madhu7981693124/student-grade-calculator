  // ── Auto-fill ───────────────────────────────────────────────
  window.onBranchOrSemChange = function () {
    const branch = document.getElementById("branchSelect").value;
    const sem    = document.getElementById("semSelect").value;
    const info   = document.getElementById("autoFillInfo");
    if (!branch || !sem) { info.textContent = ""; return; }
    const subjects = CURRICULUM[branch]?.[sem];
    if (!subjects) {
      info.textContent = "No preset data for this combination. Add subjects manually.";
      return;
    }
    document.getElementById("subjectRows").innerHTML = "";
    subjects.forEach(s => addSubject(s.name, s.credits));
    info.textContent = `✅ Auto-filled ${subjects.length} subjects for ${branch} – ${sem}`;
  };

  window.addSubject = function (name = "", credits = "") {
    const container = document.getElementById("subjectRows");
    const row = document.createElement("div");
    row.className = "subject-row";
    row.innerHTML = `
      <input class="sub-name" type="text" placeholder="Subject name" value="${name}" />
      <select class="grade-sel">
        ${Object.keys(GRADE_POINTS).map(g => `<option value="${g}">${g}</option>`).join("")}
      </select>
      <input type="number" class="credit-inp" placeholder="Credits" min="1" max="6" value="${credits}" />
      <button class="remove-btn" onclick="this.closest('.subject-row').remove()">✕</button>
    `;
    container.appendChild(row);
  };

  window.calcAndSaveSemester = async function () {
    const errEl = document.getElementById("semError");
    const sucEl = document.getElementById("semSuccess");
    errEl.textContent = ""; sucEl.textContent = "";

    const sem = document.getElementById("semSelect").value;
    if (!sem) { errEl.textContent = "Please select a semester."; return; }

    const rows = document.querySelectorAll(".subject-row");
    if (!rows.length) { errEl.textContent = "Add at least one subject."; return; }

    let weightedSum = 0, totalCredits = 0, valid = true;
    rows.forEach(row => {
      const name    = row.querySelector(".sub-name").value.trim();
      const grade   = row.querySelector(".grade-sel").value;
      const credits = parseFloat(row.querySelector(".credit-inp").value);
      if (!name || isNaN(credits) || credits <= 0) { valid = false; return; }
      weightedSum  += GRADE_POINTS[grade] * credits;
      totalCredits += credits;
    });

    if (!valid)        { errEl.textContent = "Fill in all subject names and valid credits."; return; }
    if (!totalCredits) { errEl.textContent = "Total credits must be greater than 0."; return; }

    const sgpa = parseFloat((weightedSum / totalCredits).toFixed(2));
    try {
      await saveSemester(currentUser.uid, { sem, sgpa, credits: totalCredits });
      sucEl.textContent = `✅ ${sem} saved! SGPA: ${sgpa}`;
      resetNewSemForm();
      refreshCGPA();
    } catch (e) {
      errEl.textContent = "❌ Save failed: " + e.message;
    }
  };

  window.resetNewSemForm = function () {
    document.getElementById("branchSelect").value = "";
    document.getElementById("semSelect").value    = "";
    document.getElementById("autoFillInfo").textContent = "";
    document.getElementById("subjectRows").innerHTML    = "";
    document.getElementById("semError").textContent     = "";
  };

  // ── Load & display CGPA ─────────────────────────────────────
  async function refreshCGPA() {
    const sems = await getSemesters(currentUser.uid);
    const noDataMsg = document.getElementById("noDataMsg");

    if (!sems.length) {
      noDataMsg.style.display = "";
      document.getElementById("cgpaResult").style.display = "none";
      document.getElementById("semBreakdown").innerHTML = "<p class='info'>No data yet.</p>";
      return;
    }

    noDataMsg.style.display = "none";
    const tw   = sems.reduce((s, x) => s + parseFloat(x.sgpa) * x.credits, 0);
    const tc   = sems.reduce((s, x) => s + x.credits, 0);
    const cgpa = parseFloat((tw / tc).toFixed(2));

    document.getElementById("cgpaValue").textContent    = cgpa.toFixed(2);
    document.getElementById("cgpaPercent").textContent  = "approx " + toPercent(cgpa) + "%";
    document.getElementById("cgpaPerf").textContent     = getClassAward(cgpa);
    document.getElementById("cgpaResult").style.display = "";

    document.getElementById("semBreakdown").innerHTML = sems.map(s => `
      <div class="sem-item">
        <div class="sem-info"><span>${s.sem}</span><span class="badge">${s.credits} cr</span></div>
        <div class="sem-actions"><span class="sgpa-val">SGPA: ${parseFloat(s.sgpa).toFixed(2)}</span></div>
      </div>`).join("");
  }

  requireAuth(async user => {
    currentUser = user;
    document.getElementById("userChip").textContent = user.displayName || user.email;
    addSubject();
    await refreshCGPA();
  });
